<div class="log-reg-page">
    <main>
        <!-- Header -->
        <header class="bg-dark text-white text-center ">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <a class="navbar-brand" href="#">
                    <img src="../img/pongbaslık-Photoroom.png" width="90" class="d-inline-block align-top" alt=""
                        loading="lazy">
                </a>
                <h3 class="mb-0 text-center">Hoşgeldiniz..</h3>
            </div>
        </header>
        <!-- Header Sonu -->
        <!-- Form -->
        <section>
            <!-- Giriş Formu -->
            <form id="login-form" class="form-container">
                <h1>Giriş Yap</h1>
                <article>
                    <label for="login-sign">Kullanıcı Adı:</label>
                    <input type="text" id="login-sign" name="sign" required>
                </article>
                <article>
                    <label for="login-password">Şifre:</label>
                    <input type="password" id="login-password" name="password" required>
                </article>
                <article>
                    <button type="submit">Giriş Yap</button>
                </article>
                <article class="divider-wrapper">
                    <span class="divider">YA DA</span>
                </article>
                <article class="social-section" id="42-login">
                    <button class="social-btn">
                        <img class="social-btn-icon" src="../img/42logo.svg" alt="42" width="20">
                        <span> ile Giriş Yap</span>
                    </button>
                </article>
                <article>
                    <a href="#" id="switch-to-register" style="text-decoration: none;">Hesabım yok</a>
                </article>
                <article>
                    <a href="/profile" data-link style="text-decoration: none;">dümenden giris</a>
                </article>
            </form>
            <!-- Kayıt Formu -->
            <form id="register-form" class="form-container hidden">
                <h1>Kayıt Ol</h1>
                <article>
                    <label for="register-first_name">Ad:</label>
                    <input type="text" id="register-first_name" name="first_name" required>
                </article>
                <article>
                    <label for="register-last_name">Soyad:</label>
                    <input type="text" id="register-last_name" name="last_name" required>
                </article>
                <article>
                    <label for="register-username">Kullanıcı Adı:</label>
                    <input type="text" id="register-username" name="username" required>
                </article>
                <article>
                    <label for="register-email">E-posta:</label>
                    <input type="email" id="register-email" name="email" required>
                </article>
                <article>
                    <label for="register-password">Şifre:</label>
                    <input type="password" id="register-password" name="password" required>
                </article>
                <article>
                    <label for="register-avatar">Profil Fotoğrafı:</label>
                    <input type="file" id="register-avatar" name="avatar" accept="image/*" required>
                </article>
                <article>
                    <button type="submit">Kayıt Ol</button>
                </article>
                <article>
                    <a href="#" id="switch-to-login" style="text-decoration: none;">Hesabım var</a>
                </article>
            </form>
        </section>
        <!-- Form Sonu -->
        <!-- Özel JS -->
        <!-- <script src="../js/log-reg.js"></script> -->
    </main>
</div>
