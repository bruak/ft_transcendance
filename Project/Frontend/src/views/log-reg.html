<div class="log-reg-page">

  <main>
    <!-- Formlar -->
    <section>
      <!-- Giriş Formu -->
      <form id="login-form" class="form-container slide-in">
        <h1>Giriş Yap</h1>
        <div class="error-container" id="login-error-container"></div>
        <article>
          <label for="login-sign">Kullanıcı Adı:</label>
          <input type="text" id="login-sign" name="sign" required aria-required="true">
        </article>
        <article>
          <label for="login-password">Şifre:</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" name="password" required aria-required="true">
            <button type="button" class="toggle-password" data-target="login-password"
              aria-label="Şifreyi göster/gizle">Göster</button>
          </div>
        </article>
        <article>
          <button type="submit" id="login-submit-btn">Giriş Yap</button>
        </article>
        <article class="divider-wrapper">
          <span class="divider">YA DA</span>
        </article>
        <article class="social-section" id="42-login">
          <button class="social-btn" id="42login" aria-label="42 ile Giriş Yap">
            <img class="social-btn-icon" src="/img/42logo.svg" alt="42" width="20">
            <span> ile Giriş Yap</span>
          </button>
        </article>
        <article>
          <a href="#" id="switch-to-register" style="text-decoration: none; color: #4ca1af;"
            aria-label="Kayıt olmak için tıklayın">Hesabım yok</a>
        </article>
        <article id="forgot-password">
          <a data-link style="text-decoration: none; color: #f39c12;" aria-label="Şifre sıfırlama sayfasına git">Şifremi
            Unuttum!</a>
        </article>
      </form>
      <!-- Giriş Formu Sonu -->

      <!-- Kayıt Formu -->
      <form id="register-form" class="form-container hidden">
        <h1>Kayıt Ol</h1>
        <div class="error-container" id="register-error-container"></div>

        <!-- Adım Göstergesi (Stepper) -->
        <div class="stepper-container" role="progressbar" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1">
          <div class="step active">
            <div class="step-number">1</div>
            <div class="step-title">Ad</div>
          </div>
          <div class="step">
            <div class="step-number">2</div>
            <div class="step-title">Soyad</div>
          </div>
          <div class="step">
            <div class="step-number">3</div>
            <div class="step-title">Kullanıcı Adı</div>
          </div>
          <div class="step">
            <div class="step-number">4</div>
            <div class="step-title">E-posta</div>
          </div>
          <div class="step">
            <div class="step-number">5</div>
            <div class="step-title">Şifre</div>
          </div>
          <div class="step">
            <div class="step-number">6</div>
            <div class="step-title">Profil Fotoğrafı</div>
          </div>
        </div>

        <!-- Progres Bar -->
        <div class="progress-bar-wrapper">
          <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- Adım 1 (Ad) -->
        <div class="form-step-card active" role="tabpanel" aria-labelledby="step-1">
          <article>
            <label for="register-first_name">Ad:</label>
            <input type="text" id="register-first_name" name="first_name" required aria-required="true">
            <div class="field-error" id="first-name-error"></div>
          </article>
          <div class="button-group">
            <button type="button" class="btn-next" id="next-1">İleri</button>
          </div>
        </div>

        <!-- Adım 2 (Soyad) -->
        <div class="form-step-card hidden" role="tabpanel" aria-labelledby="step-2">
          <article>
            <label for="register-last_name">Soyad:</label>
            <input type="text" id="register-last_name" name="last_name" required aria-required="true">
            <div class="field-error" id="last-name-error"></div>
          </article>
          <div class="button-group">
            <button type="button" class="btn-prev" id="prev-2">Geri</button>
            <button type="button" class="btn-next" id="next-2">İleri</button>
          </div>
        </div>

        <!-- Adım 3 (Kullanıcı Adı) -->
        <div class="form-step-card hidden" role="tabpanel" aria-labelledby="step-3">
          <article>
            <label for="register-username">Kullanıcı Adı:</label>
            <input type="text" id="register-username" name="username" required aria-required="true">
            <div class="field-error" id="username-error"></div>
          </article>
          <div class="button-group">
            <button type="button" class="btn-prev" id="prev-3">Geri</button>
            <button type="button" class="btn-next" id="next-3">İleri</button>
          </div>
        </div>

        <!-- Adım 4 (E-posta) -->
        <div class="form-step-card hidden" role="tabpanel" aria-labelledby="step-4">
          <article>
            <label for="register-email">E-posta:</label>
            <input type="email" id="register-email" name="email" required aria-required="true">
            <div class="field-error" id="email-error">Lütfen geçerli bir e-posta giriniz.</div>
          </article>
          <div class="button-group">
            <button type="button" class="btn-prev" id="prev-4">Geri</button>
            <button type="button" class="btn-next" id="next-4">İleri</button>
          </div>
        </div>

        <!-- Adım 5 (Şifre) -->
        <div class="form-step-card hidden" role="tabpanel" aria-labelledby="step-5">
          <article>
            <label for="register-password">Şifre:</label>
            <div class="password-wrapper">
              <input type="password" id="register-password" name="password" required aria-required="true">
              <button type="button" class="toggle-password" data-target="register-password"
                aria-label="Şifreyi göster/gizle">Göster</button>
            </div>
            <div class="field-error" id="password-error"></div>
          </article>
          <article>
            <label for="register-password-confirm">Şifre (Tekrar):</label>
            <div class="password-wrapper">
              <input type="password" id="register-password-confirm" name="password_confirm" required
                aria-required="true">
              <button type="button" class="toggle-password" data-target="register-password-confirm"
                aria-label="Şifreyi göster/gizle">Göster</button>
            </div>
            <div class="field-error" id="password-confirm-error"></div>
          </article>
          <div class="button-group">
            <button type="button" class="btn-prev" id="prev-5">Geri</button>
            <button type="button" class="btn-next" id="next-5">İleri</button>
          </div>
        </div>

        <!-- Adım 6 (Profil Fotoğrafı) -->
        <div class="form-step-card hidden" role="tabpanel" aria-labelledby="step-6">
          <article>
            <label for="">Profil Fotoğrafı:</label>
            <input type="file" id="register-avatar" name="avatar" accept="image/*" aria-describedby="avatar-help">
            <small id="avatar-help" class="form-text">Maksimum boyut: 2MB (JPG, JPEG, PNG)</small>
            <div class="field-error" id="avatar-error"></div>
            <img id="avatar-preview" class="d-none mx-auto rounded-circle img-thumbnail" style="max-width: 150px; max-height: 150px;" />
          </article>
          <div class="button-group">
            <button type="button" class="btn-prev" id="prev-6">Geri</button>
            <button type="submit" class="btn-next" id="register-submit-btn">Kayıt Ol</button>
          </div>
        </div>

        <article style="margin-top: 20px;">
          <a href="#" id="switch-to-login" style="text-decoration: none; color: #4ca1af;"
            aria-label="Giriş sayfasına dön">Hesabım var</a>
        </article>
      </form>
      <!-- Kayıt Formu Sonu -->
    </section>
    <!-- Form Sonu -->
  </main>
</div>
