<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .verification-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="verification-container">
        <h3 class="mb-4">Email Verification</h3>
        <div id="loading" class="mb-3">
            <p>Verifying your email, please wait...</p>
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <div id="success" style="display: none;">
            <p class="text-success">Your email has been successfully verified! 🎉</p>
            <a href="/" class="btn btn-primary mt-3">Go to Homepage</a>
        </div>
        <div id="error" style="display: none;">
            <p class="text-danger">Verification failed. The link may be invalid or expired.</p>
            <a href="/resend-verification" class="btn btn-warning mt-3">Resend Verification Email</a>
        </div>
    </div>
