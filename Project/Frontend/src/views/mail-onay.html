<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Onay Bekleniyor</title>
	<!-- Bootstrap CSS bağlantısı -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
			body {
				background-color: #f0f8ff; /* Daha yumuşak bir arka plan rengi */
				font-family: 'Arial', sans-serif; /* Daha modern bir yazı tipi */
			}
			.container {
				background-color: rgba(255, 255, 255, 0.9); /* Daha açık bir form arka plan rengi */
				padding: 40px; /* Form iç boşluk */
				border-radius: 20px; /* Form köşe yuvarlama */
				box-shadow: 0 0 20px rgba(0, 0, 0, 0.1); /* Daha hafif bir form gölge */
			}
			.btn-primary {
				background-color: #007bff; /* Buton arka plan rengi */
				border-color: #007bff; /* Buton kenarlık rengi */
				padding: 10px 20px; /* Buton iç boşluk */
				font-size: 1.2em; /* Buton yazı boyutu */
			}
			h1 {
				color: #333; /* Başlık rengi */
				margin-bottom: 20px; /* Başlık alt boşluk */
			}
	</style>
</head>
<body>
	<section style="width: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);" class="container">
		<article>
			<h1 class="text-center">E-postanız Onaylandı</h1>
			<a style="text-decoration: none;" class="btn btn-primary text-center d-block mt-3" href="index.html">Giriş Yapabilirsiniz</a>
		</article>
	</section>
</body>
</html>
