<!DOCTYPE html>
<html lang="tr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="İki Faktörlü Doğrulama">
	<title>İki Faktörlü Doğrulama</title>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="../css/2factor.css">
</head>

<body class="auth-page">
	<main class="auth-container">
		<div class="glass-card">
			<!-- Doğrulama Formu -->
			<section id="onay-formu" class="verification-section">
				<h1><i class="fas fa-shield-alt"></i> Doğrulama Kodu</h1>
				<p class="text-center description">E-posta adresinize gönderilen 4 haneli kodu giriniz</p>

				<form id="onay-form" method="POST">
					<div class="verification-inputs">
						<fieldset class="code-fieldset">
							<div class="code-inputs">
								<input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autofocus
									aria-label="Birinci rakam" id="digit-1" required>
								<input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]"
									aria-label="İkinci rakam" id="digit-2" required>
								<input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]"
									aria-label="Üçüncü rakam" id="digit-3" required>
								<input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]"
									aria-label="Dördüncü rakam" id="digit-4" required>
							</div>
						</fieldset>
					</div>

					<!-- Hata Mesajı -->
					<div id="error-message" class="alert alert-danger" role="alert" style="display: none;">
						<i class="fas fa-exclamation-circle"></i>
						<span>Geçersiz doğrulama kodu. Lütfen tekrar deneyin.</span>
					</div>

					<!-- Doğrulama Butonu -->
					<button type="submit" class="btn btn-primary">
						<i class="fas fa-check-circle"></i> Onayla
					</button>

					<!-- Yeniden Kod Gönderme -->
					<div class="resend-code">
						<p>Kod gelmedi mi? <a href="#" id="resendCode">Tekrar Gönder</a></p>
						<span id="timer" class="d-none">Tekrar göndermek için bekleyin: <span
								id="countdown">60</span>s</span>
					</div>
				</form>
			</section>

			<!-- Başarılı Doğrulama Mesajı -->
			<section id="onay-mesaji" class="success-section" style="display: none;">
				<div class="success-animation">
					<i class="fas fa-check-circle"></i>
				</div>
				<h2>E-posta Onaylandı</h2>
				<p class="text-center mb-4">Hesabınız başarıyla doğrulandı!
					<br>Sayfanıza Yönlendiriliyorsunuz.</p>
				</p>

			</section>
		</div>
	</main>
	<script type="module" src="../js/2fac.js"></script>
</body>
</html>
