<div class="game-page">
    <!-- Navbar -->
    <div id="navbar-container"></div>
    <!-- Navbar -->

    <style>
        #scoreboard {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 24px;
            font-family: sans-serif;
            z-index: 999;
        }
    </style>
    <main>
        <!-- Oyun Alanı -->
        <section class="d-flex justify-content-center align-items-center flex-column game-container"
            style="height: 80vh;">
            <div id="game-container" class="game-area">
                <!-- Oyun içeriği buraya gelecek -->
                <div id="scoreboard">0 : 0</div>
                <canvas id="gameCanvas" class="game-canvas"></canvas>
            </div>
            <div class="mt-4">
                <button class="btn btn-primary m-2" onclick="playAgainstComputer()">Bilgisayara Karşı Oyna</button>
                <button class="btn btn-secondary m-2" onclick="playWithFriend()">Arkadaşınla Oyna</button>
                <button class="btn btn-success m-2" onclick="playMultiplayer()">Çoklu Oyna</button>
                <a class="btn btn-warning m-2" href="/profile" data-link>Geri Dön</a>
            </div>
        </section>
        <!-- Oyun Alanı Sonu -->
    </main>
    <!-- Alt bilgi bölümü -->
    <footer class="bg-light text-center py-3 mt-4">
        <p>Tüm hakları saklıdır &copy; 2025</p>
    </footer>


</div>
