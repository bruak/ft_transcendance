<div class="game-page" role="main" aria-label="Pong Game Page">
    <!-- <link rel="stylesheet" href="/css/game.css"> -->

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark glass-effect" style="position: sticky; top: 0; z-index: 999;"
        role="navigation" aria-label="Main Navigation">
        <div class="container">
            <a class="navbar-brand" aria-label="Pong Game">
                <i class="bi bi-joystick" aria-hidden="true"></i> Pong Game
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto" role="menubar">
                    <li class="nav-item" role="none">
                        <a class="nav-link" id="home" href="/profile" data-link role="menuitem"
                            aria-label="Go to Home page">
                            <i class="bi bi-house" aria-hidden="true"></i> Home
                        </a>
                    </li>
                    <li class="nav-item" role="none">
                        <a class="nav-link" href="/about" data-link role="menuitem" aria-label="About page">
                            <i class="bi bi-info-circle" aria-hidden="true"></i> About
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="game-container" aria-label="Pong Game Area">
        <!-- Score Board -->
        <div id="scoreboard" role="status" aria-live="polite" aria-label="Game Score">0 : 0</div>

        <!-- Game Area -->
        <div id="game-container" class="game-area" aria-label="Active Game Canvas" role="application">
            <canvas id="gameCanvas" aria-label="Pong Game Canvas" tabindex="0"></canvas>
            <div class="loading-spinner" role="progressbar" aria-label="Loading game" aria-valuemin="0"
                aria-valuemax="100" aria-valuenow="50"></div>
        </div>

        <!-- Game Over Screen - Initially Hidden -->
        <!-- <div class="game-over-screen" style="display: none;">
            <h2>Oyun Bitti!</h2>
            <div>
                <button onclick="restartGame()">Yeniden Başla</button>
                <button onclick="goToMenu()">Ana Menü</button>
            </div>
        </div> -->

        <!-- Controls Information -->
        <div class="controls-info" role="region" aria-label="Game Controls Information">
            <p class="mb-0" aria-label="Game control instructions">
                <i class="bi bi-keyboard" aria-hidden="true"></i> Controls:
                <span class="badge bg-primary" aria-label="Press W key to move up">W</span>
                <span aria-hidden="true">Up</span> <span class="visually-hidden">Move Up</span> |
                <span class="badge bg-primary" aria-label="Press S key to move down">S</span>
                <span aria-hidden="true">Down</span> <span class="visually-hidden">Move Down</span>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer role="contentinfo">
        <p class="mb-0">
            <i class="bi bi-code-slash" aria-hidden="true"></i> 2025 Tüm hakları saklı değildir.
        </p>
    </footer>
</div>
