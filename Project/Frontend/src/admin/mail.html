<h4>Mail Token List</h4>
<table class="table table-bordered table-striped">
	<thead>
	  <tr>
		<th>Username</th>
		<th>Email</th>
		<th>Type</th>
		<th>Expiration</th>
		<th>Status</th>
		<th></th>
	  </tr>
	</thead>
	<tbody id="MailTableBody">
	  <!-- Kullanıcı bilgileri buraya JavaScript ile eklenecek -->
	</tbody>
  </table>

<!-- Mail Token Bilgi Modalı -->
<div class="modal fade" id="MailTokenInfoModal" tabindex="-1" aria-labelledby="MailTokenInfoModalLabel" aria-hidden="true">
	<div class="modal-dialog">
	  <div class="modal-content">
		<div class="modal-header">
		  <h5 class="modal-title" id="MailTokenInfoModalLabel">Mail Token Bilgileri</h5>
		  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
		</div>
		<div class="modal-body">
			  <p><strong>Kullanıcı Adı:</strong> <span id="userUsername"></span></p>
			  <p><strong>E-posta:</strong> <span id="userEmail"></span></p>
			  <p><strong>Token:</strong> <span id="mailToken"></span></p>
			  <p><strong>Tür:</strong> <span id="tokenType"></span></p>
			  <p><strong>Durum:</strong> <span id="tokenStatus"></span></p>
			  <p><strong>Son Kullanma Tarihi:</strong> <span id="expiration"></span></p>
			  <p><strong>Oluşturulma Tarihi:</strong> <span id="created"></span></p>
			  <p><strong>Güncellenme Tarihi:</strong> <span id="updated"></span></p>
			</div>
		  </div>
		</div>
		<div class="modal-footer">
		  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Kapat</button>
		</div>
	  </div>
	</div>
  </div>
