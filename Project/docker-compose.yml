networks:
  webnet:
    driver: bridge

volumes:
  static_user:

services:
  user_db:
    image: postgres:13
    container_name: user_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=users

  users:
    build:
     context: ./User
    volumes:
      - ./User/srcs:/app
    networks:
      - webnet
    ports:
      - "8000:8000"
    depends_on:
      - user_db
    env_file:
      - .env
    environment:
      - DB_HOST=user_db
      - POSTGRES_DB=users


  friend_db:
    image: postgres:13
    container_name: friend_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=friends

  friend:
    build:
      context: ./Friend
    volumes:
      - ./Friend/srcs:/app
    networks:
      - webnet
    ports:
      - "8001:8000"
    depends_on:
      - friend_db
    env_file:
      - .env
    environment:
      - DB_HOST=friend_db
      - POSTGRES_DB=friends

  mail:
    build:
      context: ./Mail
    volumes:
      - ./Mail/srcs:/app
    networks:
      - webnet
    ports:
      - "8002:8000"
    env_file:
      - .env
    depends_on:
      - mail_db
    environment:
      - DB_HOST=mail_db
      - POSTGRES_DB=mail

  mail_db:
    image: postgres:13
    container_name: mail_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=mail

  auth:
    build:
      context: ./Auth
    volumes:
      - ./Auth/srcs:/app
    networks:
      - webnet
    ports:
      - "8003:8000"
    env_file:
      - .env
    depends_on:
      - auth_db
    environment:
      - DB_HOST=auth_db
      - POSTGRES_DB=auth

  auth_db:
    image: postgres:13
    container_name: auth_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=auth

  nginx:
    build:
      context: ./Nginx
    container_name: nginx
    networks:
      - webnet
    depends_on:
      - users
      - friend
      - mail
      - auth
    ports:
      - 8080:443
    volumes:
      - ./Frontend:/run/nginx/html
      - ./User/srcs/staticfiles:/run/nginx/html/static_user
      - ./Friend/srcs/staticfiles:/run/nginx/html/static_friend
      - ./Mail/srcs/staticfiles:/run/nginx/html/static_mail
      - ./Auth/srcs/staticfiles:/run/nginx/html/static_auth
      - ./Auth/srcs/media/avatars:/run/nginx/html/src/media/avatars

