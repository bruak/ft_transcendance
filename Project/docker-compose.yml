networks:
  webnet:
    driver: bridge

services:
  user_db:
    image: postgres:13
    container_name: user_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=users

  users:
    build:
     context: ./User
    volumes:
      - ./User/srcs:/app
    networks:
      - webnet
    depends_on:
      - user_db
    env_file:
      - .env
    environment:
      - DB_HOST=user_db
      - POSTGRES_DB=users


  friend_db:
    image: postgres:13
    container_name: friend_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=friends

  friend:
    build:
      context: ./Friend
    volumes:
      - ./Friend/srcs:/app
    networks:
      - webnet
    depends_on:
      - friend_db
    env_file:
      - .env
    environment:
      - DB_HOST=friend_db
      - POSTGRES_DB=friends

  mail:
    build:
      context: ./Mail
    volumes:
      - ./Mail/srcs:/app
    networks:
      - webnet
    env_file:
      - .env


  auth:
    build:
      context: ./Auth
    volumes:
      - ./Auth/srcs:/app
    networks:
      - webnet
    env_file:
      - .env
    depends_on:
      - auth_db
    environment:
      - DB_HOST=auth_db
      - POSTGRES_DB=auth

  auth_db:
    image: postgres:13
    container_name: auth_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=auth

  nginx:
    build:
      context: ./Nginx
    container_name: nginx
    networks:
      - webnet
    depends_on:
      - users
      - friend
      - mail
      - auth
      - game
    env_file:
      - .env
    ports:
      - 8080:443
    volumes:
      - ./Auth/srcs/media/avatars:/run/nginx/html/src/media/avatars
      - ./Frontend:/run/nginx/html

  game:
    build:
      context: ./Game
    volumes:
      - ./Game/srcs:/app
    networks:
      - webnet
    env_file:
      - .env
    depends_on:
      - game_db
    ports:
      - 8000:8000
    environment:
      - DB_HOST=game_db
      - POSTGRES_DB=game

  game_db:
    image: postgres:13
    container_name: game_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=game

  redis:
    image: redis:7.0
    container_name: redis
    networks:
      - webnet
    expose:
      - "6379"

  gateway:
    build:
      context: ./Gateway
    volumes:
      - ./Gateway/srcs:/app
    networks:
      - webnet
    env_file:
      - .env

  translation:
    build:
      context: ./Translation
    volumes:
      - ./Translation/srcs:/app
      - ./Translation/locale:/app/locale
    networks:
      - webnet
    env_file:
      - .env
    environment:
      - LANG=C.UTF-8

  notification:
    build:
      context: ./Notification 
    volumes:
      - ./Notification/srcs:/app
    networks:
      - webnet
    env_file:
      - .env
