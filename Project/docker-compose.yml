networks:
  webnet:
    driver: bridge
 
services:
  user_db:
    image: postgres:13
    container_name: user_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=users

  users:
    build:
     context: ./Django
    volumes:
      - ./Django/srcs:/app
    networks:
      - webnet
    ports:
      - "8000:8000"
    depends_on:
      - user_db
    env_file:
      - .env
    environment:
      - DB_HOST=user_db
      - POSTGRES_DB=users
 

  friend_db:
    image: postgres:13
    container_name: friend_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=friends

  friend:
    build:
      context: ./Friend
    volumes:
      - ./Friend/srcs:/app
    networks:
      - webnet
    ports:
      - "8001:8000"
    depends_on:
      - friend_db
    env_file:
      - .env
    environment:
      - DB_HOST=friend_db
      - POSTGRES_DB=friends

  mail:
    build:
      context: ./Mail
    volumes:
      - ./Mail/srcs:/app
    networks:
      - webnet
    ports:
      - "8002:8000"
    env_file:
      - .env
    depends_on:
      - mail_db
    environment:
      - DB_HOST=mail_db
      - POSTGRES_DB=mail
 
  mail_db:
    image: postgres:13
    container_name: mail_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=mail

  auth:
    build:
      context: ./Auth 
    volumes:
      - ./Auth/srcs:/app
    networks:
      - webnet
    ports:
      - "8003:8000"
    env_file:
      - .env
    depends_on:
      - auth_db
    environment:
      - DB_HOST=auth_db
      - POSTGRES_DB=auth 
 
  auth_db:
    image: postgres:13
    container_name: auth_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=auth

  game:
    build:
      context: ./Game 
    volumes:
      - ./Game/srcs:/app
    networks:
      - webnet
    ports:
      - "8005:8000"
    env_file:
      - .env
    depends_on:
      - game_db
    environment:
      - DB_HOST=game_db
      - POSTGRES_DB=game
 
  game_db:
    image: postgres:13
    container_name: game_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=game

# MONITORING START HERE 

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./Monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - webnet

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - webnet

  postgres_exporter:
    image: prom/postgres-exporter
    container_name: postgres_exporter
    ports:
      - "9187:9187"
    volumes:
      - ./Monitoring/postgres_exporter/queries.yml:/etc/postgres-exporter/queries.yml
    networks:
      - webnet
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@user_db:5432/${POSTGRES_DB}?sslmode=disable

# MONITORING END HERE

  chat:
    build:
      context: ./Chat 
    volumes:
      - ./Chat/srcs:/app
    networks:
      - webnet
    ports:
      - "8006:8000"
    env_file:
      - .env
    depends_on:
      - chat_db
    environment:
      - DB_HOST=chat_db
      - POSTGRES_DB=chat
 
  chat_db:
    image: postgres:13
    container_name: chat_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=chat

  tournement:
    build:
      context: ./Tournement 
    volumes:
      - ./Tournement/srcs:/app
    networks:
      - webnet
    ports:
      - "8004:8000"
    env_file:
      - .env
    depends_on:
      - tournement_db
    environment:
      - DB_HOST=tournement_db
      - POSTGRES_DB=tournement
 
  tournement_db:
    image: postgres:13
    container_name: tournement_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=tournement
