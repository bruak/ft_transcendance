  game:
    build:
      context: ./Game
    volumes:
      - ./Game/srcs:/app
    networks:
      - webnet
    ports:
      - "8004:8000"
    env_file:
      - .env
    depends_on:
      - game_db
    environment:
      - DB_HOST=game_db
      - POSTGRES_DB=game

  game_db:
    image: postgres:13
    container_name: game_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=game

  redis:
    image: redis:7.0
    container_name: redis
    networks:
      - webnet
    expose:
      - "6379"

  gateway:
    build:
      context: ./Gateway
    volumes:
      - ./Gateway/srcs:/app
    networks:
      - webnet
    ports:
      - "8005:8000"
    env_file:
      - .env
    depends_on:
      - gateway_db
    environment:
      - DB_HOST=gateway_db
      - POSTGRES_DB=gateway

  gateway_db:
    image: postgres:13
    container_name: gateway_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=gateway

  translation:
    build:
      context: ./Translation
    volumes:
      - ./Translation/srcs:/app
      - ./Translation/locale:/app/locale
    networks:
      - webnet
    ports:
      - "8006:8000"
    env_file:
      - .env
    depends_on:
      - translation_db
    environment:
      - DB_HOST=translation_db
      - POSTGRES_DB=translation
      - LANG=C.UTF-8

  translation_db:
    image: postgres:13
    container_name: translation_db
    env_file:
      - .env
    networks:
      - webnet
    expose:
      - 5432
    environment:
      - POSTGRES_DB=translation
