<!DOCTYPE html>
<html lang="en">
<head>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PUT API Mock Request</title>
    </head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <style>
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #F4F4F4;
        }
        form {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="text"], input[type="email"], input[type="file"], button {
            margin: 10px 5px;
            padding: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45A049;
        }
        img.avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">User Management</h1>
    <!-- User Creation Form -->
    <form id="user-form" enctype="multipart/form-data">
        <h2>Add New User</h2>
        <input type="text" id="first_name" placeholder="First Name" required>
        <input type="text" id="last_name" placeholder="Last Name" required>
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="password" placeholder="Password" required>
        <input type="file" id="avatar" accept="image/*">
        <button type="submit">Add User</button>
    </form>
    <!-- Edit User Form -->
    <form id="edit-form" style="display: none;" enctype="multipart/form-data">
        <h2>Edit User</h2>
        <input type="hidden" id="edit_id">
        <input type="text" id="edit_first_name" placeholder="Edit First Name" required>
        <input type="text" id="edit_last_name" placeholder="Edit Last Name" required>
        <input type="text" id="edit_username" placeholder="EditUsername" required>
        <input type="email" id="edit_email" placeholder="Edit Email" required>
        <input type="text" id="edit_password" placeholder="Edit Password">
        <input type="file" id="edit_avatar" accept="image/*">
        <button type="submit">Update User</button>
    </form>
    <!-- User Table -->
    <table>
        <thead>
            <tr>
                <th>Avatar</th>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Username</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="user-table-body">
            <!-- Dynamic rows will be inserted here -->
        </tbody>
    </table>
    <script>
        const DOMAIN = "http://localhost:8000"//window.location.origin;
        const GET_API_URL = `${DOMAIN}/api/get/`;
        const POST_API_URL = `${DOMAIN}/api/post/`;
        const PUT_API_URL = `${DOMAIN}/api/put/`;
        // Fetch users and display in table
        async function fetchUsers() {
            try {
                const response = await fetch(GET_API_URL);
                if (!response.ok) {
                    throw new Error(`Error: ${response.status} - ${response.statusText}`);
                }
                const users = await response.json();
                const tableBody = document.getElementById('user-table-body');
                tableBody.innerHTML = ''; // Clear table body
                // Populate table with user data
                users.forEach(user => {
                const avatarUrl = user.avatar.startsWith('http') ? user.avatar : `${DOMAIN}/${user.avatar}`;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><img src="${avatarUrl}" class="avatar" alt="Avatar"></td>
                    <td>${user.id}</td>
                    <td>${user.first_name}</td>
                    <td>${user.last_name}</td>
                    <td>${user.username}</td>
                    <td>${user.email}</td>
                    <td>
                        <button onclick="editUser(${user.id}, '${user.first_name}', '${user.last_name}', '${user.username}', '${user.email}')">Edit</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
            } catch (error) {
                console.error('Failed to fetch users:', error);
            }
        }
        // Open edit form with user data
        function editUser(id, firstName, lastName, username, email) {
            document.getElementById('edit_id').value = id;
            document.getElementById('edit_first_name').value = firstName;
            document.getElementById('edit_last_name').value = lastName;
            document.getElementById('edit_username').value = username;
            document.getElementById('edit_email').value = email;
            document.getElementById('edit-form').style.display = 'block';
        }
        // Update user
        async function updateUser(event) 
        {
            event.preventDefault();
                const userId = document.getElementById('edit_id').value;
            
 
                const formData = new FormData();
                formData.append('_method', 'PUT');
                formData.append('first_name', document.getElementById('edit_first_name').value);
                formData.append('last_name', document.getElementById('edit_last_name').value);
                formData.append('username', document.getElementById('edit_username').value);
                formData.append('email', document.getElementById('edit_email').value);
                formData.append('password', document.getElementById('edit_password').value);

                const avatarFile = document.getElementById('edit_avatar').files[0];
                if (avatarFile) {
                    formData.append('avatar', avatarFile);
                }

                try {
                    const response = await fetch(`http://localhost:8000/api/put/${userId}`, {
                        method: 'POST', // Burada POST kullanılıyor
                        body: formData,
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`Failed to update user. Status: ${response.status}, Response: ${errorText}`);
                    }

                    const updatedUser = await response.json();
                    alert(`User updated successfully: ${updatedUser.username}`);
                } catch (error) {
                    alert(`Error: ${error.message}`);
                }
                fetchUsers();

        }
        // Load users on page load
        document.addEventListener('DOMContentLoaded', fetchUsers);
        // Add event listener to the forms
        document.getElementById('user-form').addEventListener('submit', addUser);
        document.getElementById('edit-form').addEventListener('submit', updateUser);
        // Add new user function (remains the same)
        async function addUser(event) {
            event.preventDefault();
            const firstName = document.getElementById('first_name').value;
            const lastName = document.getElementById('last_name').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const avatarFile = document.getElementById('avatar').files[0];
            const newUser = new FormData();
            newUser.append('first_name', firstName);
            newUser.append('last_name', lastName);
            newUser.append('username', username);
            newUser.append('email', email);
            newUser.append('password', password);
            if (avatarFile) {
                newUser.append('avatar', avatarFile);
            }
            try {
                const response = await fetch(POST_API_URL, {
                    method: 'POST',
                    body: newUser,
                });
                if (!response.ok) {
                    throw new Error(`Error: ${response.status} - ${response.statusText}`);
                }
                console.log('User added successfully:', await response.json());
                document.getElementById('user-form').reset();
                fetchUsers();
            } catch (error) {
                console.error('Failed to add user:', error);
            }
        }
    </script>
</body>
</html>
