# queries.yml

queries:
  - name: "pg_stat_activity_user_db"
    query: "SELECT COUNT(*) FROM pg_stat_activity WHERE state = 'active';"
    metrics:
      - active_connections_user_db
    data_source_name: "postgresql://some_user:abc123@user_db:5432/users?sslmode=disable"

  - name: "pg_stat_activity_friend_db"
    query: "SELECT COUNT(*) FROM pg_stat_activity WHERE state = 'active';"
    metrics:
      - active_connections_friend_db
    data_source_name: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@friend_db:5432/friends?sslmode=disable"

