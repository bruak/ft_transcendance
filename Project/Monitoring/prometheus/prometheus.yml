global:
  scrape_interval: 2s  # Metriklerin her 15 saniyede bir toplanmasını sağlar

scrape_configs:
  - job_name: 'node_exporter'
    static_configs:
      - targets:
          - 'node_exporter:9100'  # Burada "node_exporter" container'ına yönlendirme yapılır

  - job_name: 'postgres_exporter_dbs'
    static_configs:
      - targets:
          - 'postgres_exporter_dbs:9187'  # Burada "postgres_exporter" container'ına yönlendirme yapılır  
    metrics_path: /metrics  # Metriklerin "/metrics" yolundan toplanacağını belirtir