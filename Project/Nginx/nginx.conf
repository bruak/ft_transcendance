worker_processes auto;

events {
	worker_connections 1024;
}

http {

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	sendfile        on;
    keepalive_timeout  65;

	 upstream users_service {
         server users:8000;
     }

     upstream friend_service {
         server friend:8000;
     }
     upstream mail_service {
         server mail:8000;
     }

    upstream auth_service {
        server auth:8000;
    }
    upstream game_service {
        server game:8000;
    }

	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name localhost;

		ssl_certificate /etc/ssl/private/ngnix.crt;
		ssl_certificate_key /etc/ssl/private/nginx.key;
		ssl_protocols  TLSv1.3;

        location /api/ {
            proxy_pass http://gateway:8000/;
        }

        location / {
            root /run/nginx/html/src;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

		location /users/ {
            # Kökü /users/ olan istekleri doğrudan proxy_pass edelim
            proxy_pass http://users_service/;
            # YA DA /users/ pathini geçmek istiyorsanız şu da olabilir:
            # proxy_pass http://users_service/users/; => Farklı senaryolar

            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;

            # Özellikle Django FORCE_SCRIPT_NAME kullandığınızda
            proxy_set_header X-Script-Name /users;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        

        location /game/ {
            proxy_pass http://game_service/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }

        # Örnek: /friend/* isteklerini friend_service'e yönlendir
        location /friend/ {
            proxy_pass http://friend_service/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }

        # /mail/* istekleri mail_service'e
        location /mail/ {
            proxy_pass http://mail_service/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }

        # /auth/* istekleri auth_service'e
        location /auth/ {
            proxy_pass http://auth_service/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }

        location /static_user/ {
            alias /run/nginx/html/static_user/;  # volume'dan okuyor
        }
        location /static_friend/ {
            alias /run/nginx/html/static_friend/;  # volume'dan okuyor
        }
        location /static_mail/ {
            alias /run/nginx/html/static_mail/;  # volume'dan okuyor
        }
        location /static_auth/ {
            alias /run/nginx/html/static_auth/;  # volume'dan okuyor
        }
        # İsterseniz genel bir 404 fallback veya diğer ayarlar

	}
}

