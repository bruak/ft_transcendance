worker_processes auto;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Bu map bloğu http bloğunun doğrudan içinde olmalı
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    
    sendfile        on;
    keepalive_timeout  65;
    
    upstream game_service {
        server game:8000;
    }
   
    upstream notification_service {
        server notification:8000;
    }
    
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name !DOMAIN!;
        ssl_certificate /etc/ssl/private/ngnix.crt;
        ssl_certificate_key /etc/ssl/private/nginx.key;
        ssl_protocols  TLSv1.3;
        
        location /api/ {
            proxy_pass http://gateway:8000/;
        }
        
        location / {
            root /run/nginx/html/src;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
        
        # WebSocket configuration for /game/
        location /game/ {
            if ($http_upgrade != 'websocket') {
                return 404;
            }
            proxy_pass http://game_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            # Burada "upgrade" yerine $connection_upgrade kullanıyoruz
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            
        }
        
        # WebSocket configuration for /notification/
        location /notification/ {
            if ($http_upgrade != 'websocket') {
                return 404;
            }
            proxy_pass http://notification_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            # Burada "upgrade" yerine $connection_upgrade kullanıyoruz
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}