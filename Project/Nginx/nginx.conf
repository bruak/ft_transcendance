worker_processes auto;

events {
	worker_connections 1024;
}

http {

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	sendfile        on;
    keepalive_timeout  65;
	
	 upstream users_service {
         server users:8000;
     }

     upstream friend_service {
         server friend:8000;
     }
     upstream mail_service {
         server mail:8000;
     }

    upstream auth_service {
        server auth:8000;
    }

	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name localhost;

		ssl_certificate /etc/ssl/private/ngnix.crt;
		ssl_certificate_key /etc/ssl/private/nginx.key;
		ssl_protocols  TLSv1.3;

		location /users/ {
            proxy_pass http://users_service/;
            proxy_http_version 1.1;
            # WebSocket/ASGI için gerekli başlıklar:
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }

        # Örnek: /friend/* isteklerini friend_service'e yönlendir
        location /friend/ {
            proxy_pass http://friend_service/;
            proxy_http_version 1.1;
#
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
#
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }

        # /mail/* istekleri mail_service'e
        location /mail/ {
            proxy_pass http://mail_service/;
            proxy_http_version 1.1;
#
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
#
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }

        # /auth/* istekleri auth_service'e
        location /auth/ {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }

        # İsterseniz genel bir 404 fallback veya diğer ayarlar 

	}
}

